spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false

# ============================================================
# Logging Configuration
# ============================================================

# Nível DEBUG para todos os pacotes do projeto
logging.level.com.marmitt=TRACE

# Nível INFO para frameworks (evitar excesso de logs)
logging.level.org.springframework=INFO
logging.level.org.apache=INFO

# Pattern de log com timestamp e thread
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
