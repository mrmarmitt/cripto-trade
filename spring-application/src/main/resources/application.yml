spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ctrade}
    username: ${DB_USERNAME:ctrade}
    password: ${DB_PASSWORD:ctrade123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.marmitt: TRACE
    org.springframework: INFO
    org.apache: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

event:
  retry:
    max-attempts: 5
    initial-interval-ms: 1000
    max-interval-ms: 30000
    multiplier: 2.0

margin:
  release:
    max-attempts: 2147483647
    initial-interval-ms: 1000
    max-interval-ms: 60000
    multiplier: 2.0


runner:
  boot:
    orchestrator-enabled: true
    phase1:
      enabled: true
    phase2:
      enabled: true
      mode: WARN_ONLY
      account-query-policy: SKIP
      portfolio:
        sanity-check:
          enabled: true
          threshold: 0.00000001
        cutoff:
          enabled: true
        reservation-ttl:
          enabled: true
          ttl-ms: 300000
        zombie-detection:
          enabled: true
    phase3:
      enabled: true
