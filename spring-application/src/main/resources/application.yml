spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
      write-bigdecimal-as-plain: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ctrade}
    username: ${DB_USERNAME:ctrade}
    password: ${DB_PASSWORD:ctrade123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.marmitt: TRACE
    org.springframework: INFO
    org.apache: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

binance:
  ws-base-url: wss://stream.binance.com:9443
  rest-base-url: https://api.binance.com
  ws-api-base-url: wss://ws-api.binance.com:443/ws-api/v3
  api-key: ${BINANCE_API_KEY:}
  api-secret: ${BINANCE_API_SECRET:}

event:
  retry:
    max-attempts: 5
    initial-interval-ms: 1000
    max-interval-ms: 30000
    multiplier: 2.0

margin:
  release:
    max-attempts: 2147483647
    initial-interval-ms: 1000
    max-interval-ms: 60000
    multiplier: 2.0


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        boot.phase.duration: true
        http.server.requests: true
        jvm.gc.pause: true

runner:
  boot:
    orchestrator-enabled: true
    phase1:
      enabled: true
    phase2:
      enabled: true
      mode: WARN_ONLY
      account-query-policy: SKIP
      portfolio:
        sanity-check:
          enabled: true
          threshold: 0.00000001
        cutoff:
          enabled: true
        zombie-detection:
          enabled: true
    phase3:
      enabled: true
      exchange-query-timeout-ms: 10000
      exchange-query-max-attempts: 3
      exchange-query-initial-backoff-ms: 300
      exchange-query-backoff-multiplier: 2.0
      exchange-query-max-backoff-ms: 5000
  recovery:
    transaction:
      enabled: true
      interval-ms: 60000
      stale-threshold-ms: 30000
      max-per-run: 50

admin:
  api:
    key: ${ADMIN_API_KEY:}

notification:
  discord:
    # Vazio ⇒ notificações Discord desativadas (adapter no-op); a aplicação sobe normalmente.
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  grafana:
    # Opcional: template do link "ver logs" no Discord; {correlationId} é substituído em runtime.
    explore-url-template: ${GRAFANA_EXPLORE_URL_TEMPLATE:}
